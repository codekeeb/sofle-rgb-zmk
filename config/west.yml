manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: urob
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      # Rama de release estable: main migró al hardware model v2 de Zephyr
      # y el board nice_nano_v2 ya no existe con ese nombre allí.
      revision: v0.3
      import: app/west.yml
    - name: zmk-nice-oled
      remote: mctechnology17
      # Pantalla animada de la mitad izquierda. Rama compatible con
      # ZMK v0.3 / LVGL 8 (main del módulo apunta a ZMK main / LVGL 9).
      revision: v0.3/dev
    - name: zmk-helpers
      remote: urob
      # Macros del keymap (ZMK_UNICODE_*). Tag emparejado con ZMK v0.3.
      # Sustituye al antiguo zmk-nodefree-config (mismo autor, reestructurado).
      revision: v0.3
  self:
    path: config
