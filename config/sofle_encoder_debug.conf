# Debug build for diagnosing the rotary encoders.
#
# The EC11 driver logs every quadrature transition it sees with
# LOG_DBG("prev: %d, new: %d") plus the resulting delta, but those live
# under CONFIG_SENSOR_LOG_LEVEL, which defaults to a level that hides
# them. Turn the sensor subsystem up to DEBUG (4) so each transition
# shows up over USB, which is what tells us whether the contacts are
# bouncing (deltas flipping sign within one detent) or simply not
# producing enough pulses.
CONFIG_SENSOR_LOG_LEVEL_DBG=y

# Keep the encoder work off the ISR so the log calls are safe.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bigger buffers: at DEBUG level a single fast turn emits a burst of
# lines, and the default ring buffer drops them ("--- N messages
# dropped ---") exactly when we most need them.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
