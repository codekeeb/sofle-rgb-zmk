# Solo mitad derecha (periférico): OLED con el widget de uso de Claude.
# Este archivo se carga después de sofle.conf y sobreescribe sus valores.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Pantalla en vertical: el widget llama a lv_disp_set_rotation(ROT_90).
# La rotación por software de LVGL necesita un buffer de dibujo (VDB) del
# tamaño de la pantalla completa; 100% cubre los 128x32 = 4096 px.
CONFIG_LV_Z_VDB_SIZE=100
