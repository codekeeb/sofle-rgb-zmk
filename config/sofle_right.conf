# Solo mitad derecha (periférico): OLED con el widget de uso de Claude.
# Este archivo se carga después de sofle.conf y sobreescribe sus valores.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# El widget se ve en vertical rotando cada objeto 90° (no el display, que
# LVGL no reconfigura en caliente en ZMK v0.3). La rotación de objetos usa
# el motor de dibujo complejo; un VDB de pantalla completa evita artefactos.
CONFIG_LV_Z_VDB_SIZE=100
