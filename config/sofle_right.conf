# Solo mitad derecha (periférico): OLED con el widget de uso de Claude.
# Este archivo se carga después de sofle.conf y sobreescribe sus valores.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# El widget se ve en vertical dibujando en un canvas y rotándolo 90°
# (lv_canvas_transform), la misma técnica que el shield nice_oled. Esos
# valores son los que nice_oled usa y están probados en este OLED:
# color de 1 bit (mono) y VDB pequeño bastan; el canvas vive en RAM aparte.
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148
