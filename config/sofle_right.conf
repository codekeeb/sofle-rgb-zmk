# Right half OLED (peripheral): animation switchable at runtime
# (lower + press right encoder). CAT=n to avoid duplicating assets that
# the selectable mode already compiles.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# Display thread stack. ZMK defaults it to 2048 and that wins over the
# nice-oled module defaults; the effect-name toast overflowed it and the
# half stopped (BLE still linked, but no keys and no RGB).
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
