# Configuración para Sofle (ZMK oficial) — común a ambas mitades.
# La pantalla solo se activa en la mitad derecha (ver sofle_right.conf).
CONFIG_ZMK_DISPLAY=n

# Widget de uso de Claude (módulo local de este repo)
CONFIG_ZMK_CLAUDE_USAGE=y

# Encoders (rueda): el keymap usa sensor-bindings. Con el driver activo,
# el nodo keymap-sensors del shield enlaza sin problemas.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow (29 LEDs WS2812 por SPI; overlay en config/boards/nice_nano_v2.overlay)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_SPI=y

# ZMK Studio (edición del keymap en caliente desde la app).
CONFIG_ZMK_STUDIO=y
# El keymap no tiene tecla &studio_unlock, así que sin esto Studio
# quedaría bloqueado y no se podría usar.
CONFIG_ZMK_STUDIO_LOCKING=n

# Sleep y potencia
CONFIG_ZMK_SLEEP=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
