# Configuración para Sofle (ZMK oficial)
# La pantalla se activa solo en la mitad derecha (ver sofle_right.conf)
CONFIG_ZMK_DISPLAY=n

# Widget de uso de Claude (módulo local de este repo)
CONFIG_ZMK_CLAUDE_USAGE=y

# Desactivar encoder si no lo usas
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n

# Sleep y power settings
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2000000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n

# Desactivar RGB si no lo usas
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_SPI=n
