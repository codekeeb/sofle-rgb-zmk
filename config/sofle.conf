# Enable the Sofle OLED Display with the custom nice_oled status screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Peripheral OLED animations switchable at runtime (&oledanim,
# fork codekeeb/zmk-nice-oled selectable branch).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SELECTABLE=y
# Battery as a graphic icon with fill (instead of the % number), both OLEDs.
CONFIG_NICE_OLED_WIDGET_BATTERY_GRAPHIC=y

# Enable support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ZMK Studio NO se activa aqui: sofle.conf aplica a las DOS mitades, y
# esto metia Studio tambien en el periferico. ZMK_STUDIO hace
# "select PM_DEVICE" (ver app/src/studio/Kconfig), que cambia la gestion
# de energia de los perifericos -- incluido el radio -- en una mitad que
# ni siquiera expone el RPC. Studio se activa solo para sofle_left desde
# build.yaml (cmake-args: -DCONFIG_ZMK_STUDIO=y), que es donde toca.
# CONFIG_ZMK_STUDIO=y

# High-voltage DCDC: ZMK >= v0.3 disabled it by default (for inductor-less
# clones); without it VCC comes from the internal LDO and cannot power the
# 36 LEDs.
CONFIG_BOARD_ENABLE_DCDC_HV=y

# BLE a 2 Mbps. Zephyr lo trae en default y, pero se fija a mano para que
# no dependa de un default ajeno: ZMK_BLE_EXPERIMENTAL_CONN lo pone a n
# (ver app/Kconfig de ZMK), y activar esa opcion aqui dejaria la radio a
# 1 Mbps sin avisar -- que es exactamente lo que pasaba en el Choc, y se
# notaba como latencia al escribir por Bluetooth.
CONFIG_BT_CTLR_PHY_2M=y

# Parametros de conexion BLE. Los defaults de ZMK (latency 30, timeout
# 400) ahorran bateria dejando que el teclado se salte hasta 30 eventos
# seguidos: con intervalos de 15 ms son 450 ms sin transmitir nada.
#
# Eso hace dos cosas malas cuando la senal se degrada al alejarse: la
# primera tecla tras una pausa tarda hasta 450 ms en salir, y durante
# ese silencio el enlace no se mantiene, asi que un fallo puntual tumba
# la conexion en vez de recuperarse.
#
# latency 10 -> 150 ms como mucho. timeout 500 -> 5 s de margen antes de
# dar la conexion por perdida. Cuesta algo de bateria; con 300 mAh y
# ZMK_IDLE_TIMEOUT a 60 s hay margen de sobra.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500

# Pointing/mouse HID: needed for the &mwheel behavior (discrete scroll
# wheel on the encoders). Adds the mouse report to the HID descriptor, so
# the host may need re-pairing over BLE after this change.
CONFIG_ZMK_POINTING=y

# RGB FX (replaces ZMK's stock underglow, which only has 4 effects).
# The stock underglow enabled SPI/LED_STRIP; now we enable them by hand.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_FX=y
