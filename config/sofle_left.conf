# Solo mitad izquierda (central): pantalla animada del shield nice_oled.
# Se carga después de sofle.conf y sobreescribe su CONFIG_ZMK_DISPLAY=n.
CONFIG_ZMK_DISPLAY=y

# La pantalla custom de la izquierda la pone nice_oled; el widget de Claude
# (también pantalla custom) debe quedar fuera o habría dos
# zmk_display_status_screen() y el enlace fallaría. El servicio GATT y el
# relay al periférico (claude_usage_gatt.c) siguen activos en esta mitad.
CONFIG_ZMK_CLAUDE_USAGE_WIDGET=n
